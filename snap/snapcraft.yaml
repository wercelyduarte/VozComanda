# Pacote Snap (Snap Store / Ubuntu). Gerado pelo workflow .github/workflows/snap.yml:
#   snapcraft pack            -> vozcomanda_X.Y.Z_amd64.snap
# A versao vem da ultima tag do git (vX.Y.Z).
name: vozcomanda
title: VozComanda
base: core24
adopt-info: app
summary: Voice dictation for AI agents, with translation and read-aloud
description: |
  Talk instead of typing: VozComanda turns your voice into text ready to send to
  an AI coding agent such as Claude Code, Kiro, Cursor or ChatGPT.

  Click Record (or press F5), speak and click Stop. The text shows up in a box for
  you to review. Ctrl+S saves it to comando.txt in your project folder, where the
  agent reads and runs it.

  - Online recognition with Google, or offline with Whisper (your voice stays on your PC)
  - 10 voice languages, automatic translation while you dictate
  - Translate button: paste the agent's answer and read it in your language
  - Listen button (F6): the app reads the text aloud
  - Interface in English, Spanish and Portuguese; light and dark theme

  Made for people who find typing hard, or who would rather speak and listen.
grade: stable
license: MIT
website: https://github.com/wercelyduarte/VozComanda
source-code: https://github.com/wercelyduarte/VozComanda
issues: https://github.com/wercelyduarte/VozComanda/issues
contact: https://github.com/wercelyduarte/VozComanda/issues
confinement: strict
icon: snap/gui/vozcomanda.png

apps:
  vozcomanda:
    command: usr/bin/python3.12 $SNAP/app/vozComanda.py
    desktop: app/vozcomanda.desktop
    # Sem a extensao gnome: ela omite os pacotes que a plataforma GNOME ja tem, inclusive
    # o Python, e o Python dela nao tem Tkinter. O Tk so precisa de X11 e das fontes.
    plugs:
      - x11
      - desktop           # fontes e tema do sistema
      - desktop-legacy
      - network           # Google, traducao, voz online, download dos modelos
      - audio-record      # microfone
      - audio-playback    # leitura em voz alta
      - home              # salvar comando.txt na pasta do projeto
    environment:
      # O Python que o snap leva (com Tkinter) e as bibliotecas instaladas pelo plugin
      PYTHONHOME: $SNAP/usr
      PYTHONPATH: $SNAP/lib/python3.12/site-packages
      # Tk procura init.tcl no caminho do sistema, que fica fora do snap
      TCL_LIBRARY: $SNAP/usr/share/tcltk/tcl8.6
      TK_LIBRARY: $SNAP/usr/share/tcltk/tk8.6
      # PortAudio fala ALSA; o asound.conf manda o ALSA para o PulseAudio/PipeWire do usuario
      ALSA_CONFIG_PATH: $SNAP/etc/asound.conf
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib
      ESPEAK_DATA_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/espeak-ng-data

parts:
  deps:
    plugin: python
    source: .
    python-requirements: [requirements.txt]
    # setup.py e o build do Windows (cx_Freeze); sem ele o plugin instala so os requirements
    override-pull: |
      craftctl default
      rm -f setup.py
    stage-packages:
      # O base core24 nao tem Python: o snap leva o seu. Os pacotes do interpretador vao
      # listados porque, como simples dependencias, o snapcraft os deixa de fora.
      - python3.12-minimal
      - libpython3.12-minimal
      - libpython3.12-stdlib
      - python3-venv
      - python3-tk
      - libportaudio2     # sounddevice
      - libasound2-plugins  # ponte ALSA -> PulseAudio
      - espeak-ng         # voz offline
      - fonts-dejavu-core # simbolos dos botoes (fallback se o sistema nao tiver)
    prime:
      - -usr/share/doc
      - -usr/share/man

  app:
    plugin: dump
    source: .
    build-packages: [git]   # para ler a versao da tag
    override-pull: |
      craftctl default
      # A copia da parte nao e um repositorio git: a tag vem da pasta do projeto
      craftctl set version="$(git -c safe.directory='*' -C "$CRAFT_PROJECT_DIR" describe --tags --abbrev=0 | sed 's/^v//')"
    organize:
      vozComanda.py: app/vozComanda.py
      icone.png: app/icone.png
      snap/local/vozcomanda.desktop: app/vozcomanda.desktop
      snap/local/asound.conf: etc/asound.conf
    prime:
      - app/vozComanda.py
      - app/icone.png
      - app/vozcomanda.desktop
      - etc/asound.conf
