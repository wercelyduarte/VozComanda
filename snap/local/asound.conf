# ALSA dentro do snap: carrega a configuracao padrao do proprio snap e manda o
# dispositivo padrao para o servidor de som do usuario (PulseAudio ou PipeWire).
</snap/vozcomanda/current/usr/share/alsa/alsa.conf>
pcm.!default {
    type pulse
    fallback "sysdefault"
}
ctl.!default {
    type pulse
    fallback "sysdefault"
}
