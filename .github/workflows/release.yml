# Gera o instalador .msi e publica na pagina de Releases sempre que uma tag vX.Y.Z e enviada.
#   git tag v1.1.0 && git push origin v1.1.0
# O build roda na nuvem do GitHub, sem nenhuma credencial.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Gerar instalador
        shell: bash
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || VERSAO="0.0.0"
          export VERSAO
          python setup.py bdist_msi

      - name: Conferir que config.json nao foi empacotado
        shell: bash
        run: |
          if ls build/VozComanda/config.json 2>/dev/null; then
            echo "::error::config.json encontrado no build"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: dist/*.msi

      # Sem assinatura (a Store assina): vai como artefato da execucao, nao na release,
      # porque o Windows nao instala um .msix nao assinado direto do download.
      - name: Gerar .msix (Microsoft Store)
        run: python build_msix.py

      - uses: actions/upload-artifact@v4
        with:
          name: msix-store
          path: dist/*.msix

      - name: Publicar na pagina de Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.msi
          generate_release_notes: true
